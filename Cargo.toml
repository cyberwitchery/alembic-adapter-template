[package]
name = "alembic-adapter-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Template for an alembic external adapter"
repository = "https://github.com/cyberwitchery/alembic-adapter-template"
homepage = "https://github.com/cyberwitchery/alembic-adapter-template"

[dependencies]
alembic-core = "0.5.0"
alembic-engine = "0.5.0"
anyhow = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }

[dev-dependencies]
serde_json = "1"
