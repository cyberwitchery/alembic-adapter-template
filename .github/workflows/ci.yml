name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # the alembic release this adapter is checked against. every release attaches
  # static binaries, so the host checks below need no second toolchain or build.
  # bump this deliberately: a red run then means a real protocol break, not
  # upstream noise.
  ALEMBIC_VERSION: v0.10.0
  # ubuntu-latest runners are x86_64.
  ALEMBIC_TARGET: x86_64-unknown-linux-gnu

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps

  # protocol conformance: the runner that ships alongside alembic checks the
  # built adapter against the external-adapter contract.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fetch alembic-adapter-test
        run: |
          name="alembic-adapter-test-${ALEMBIC_VERSION}-${ALEMBIC_TARGET}"
          curl -sSfL -o runner.tar.gz \
            "https://github.com/cyberwitchery/alembic/releases/download/${ALEMBIC_VERSION}/${name}.tar.gz"
          tar xzf runner.tar.gz
          mkdir -p bin
          mv "${name}/alembic-adapter-test" bin/
      - name: build the adapter
        run: cargo build --release
      - name: run conformance
        run: ./bin/alembic-adapter-test -- ./target/release/alembic-adapter-example

  # the real host against this template: the alembic cli spawns the built
  # adapter through examples/backend.yaml and takes an inventory through plan
  # and apply, so a host-side change fails ci instead of a user's first run.
  e2e:
    name: e2e (alembic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fetch the alembic cli
        run: |
          name="alembic-${ALEMBIC_VERSION}-${ALEMBIC_TARGET}"
          curl -sSfL -o alembic.tar.gz \
            "https://github.com/cyberwitchery/alembic/releases/download/${ALEMBIC_VERSION}/${name}.tar.gz"
          tar xzf alembic.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv "${name}/alembic" "$HOME/.local/bin/alembic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run the alembic-driven e2e
        run: bash tests/e2e-alembic.sh
